<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Generator Cloud</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #38bdf8;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0ea5e9;
        }
        #status {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            word-break: break-all;
        }
    </style>
</head>
<body>
        <div class="container">
        <h2>Cloud APK Generator</h2>
        <div class="form-group">
            <label>App Name</label>
            <input type="text" id="appName" placeholder="e.g. My2DGame" value="My2DGame">
        </div>
        <div class="form-group">
            <label>Web URL / Game Link</label>
            <input type="text" id="appUrl" placeholder="https://your-game-url.com" value="https://google.com">
        </div>
        <div class="form-group">
            <label>Version Name</label>
            <input type="text" id="versionName" placeholder="1.0.0" value="1.0.0">
        </div>
        <button onclick="generateApk()">Generate APK</button>
        <div id="status"></div>
    </div>

    <script>
        async function generateApk() {
            const appName = document.getElementById('appName').value;
            const appUrl = document.getElementById('appUrl').value;
            const versionName = document.getElementById('versionName').value;
            const statusDiv = document.getElementById('status');

            if (!appName || !appUrl) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Please fill in all fields!';
                return;
            }

            statusDiv.style.color = '#f59e0b';
            statusDiv.innerText = 'Triggering cloud compilation... Please wait.';

            try {
                // Seedha Render backend URL use kiya gaya hai taaki Vercel timeout error na aaye
                const response = await fetch('https://apk-generator-0bbp.onrender.com/generate-apk', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        appName: appName,
                        appUrl: appUrl,
                        versionName: versionName
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.style.color = '#22c55e';
                    statusDiv.innerHTML = `Success! Build started on GitHub.<br><a href="https://github.com/Sahusain1/apk-generator/actions" target="_blank" style="color: #38bdf8;">Click here to check build & download APK</a>`;
                } else {
                    statusDiv.style.color = '#ef4444';
                    statusDiv.innerText = 'Error: ' + (data.message || 'Something went wrong');
                }
            } catch (error) {
                statusDiv.style.color = '#ef4444';
                statusDiv.innerText = 'Network Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
